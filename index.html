<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка — Игра в одном файле</title>
    <style>
        /* Общие стили страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Стили игрового поля */
        #game-container {
            position: relative;
            border: 3px solid #00ff00;
            border-radius: 10px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        canvas {
            display: block;
            background-color: #000000;
        }

        /* Панель счета и оверлей */
        #score-panel {
            margin-top: 15px;
            font-size: 1.2em;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 10px;
            font-size: 1.5em;
            gap: 20px;
        }

        #game-over h2 {
            margin: 0;
            font-size: 2em;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<h1>🐍 Змейка</h1>
<div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="game-over">
        <h2>Игра окончена!</h2>
        <p>Ваш счет: <span id="final-score">0</span></p>
        <button id="restart-btn">Играть снова</button>
    </div>
</div>
<div id="score-panel">Счет: 0</div>

<script>
    // Получаем элементы страницы
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score-panel');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreText = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    // Размер одной клетки
    const box = 20;

    // Размер игрового поля в клетках (400px / 20px = 20 клеток)
    const gridSize = canvas.width / box;

    // Координаты змейки (массив клеток)
    let snake = [];
    // Начальная длина змейки
    const startLength = 3;

    // Координаты еды
    let food = {};

    // Счет
    let score = 0;

    // Направление движения
    let dx = 1;
    let dy = 0;

    // Флаг игры
    let gameActive = false;
    let gameInterval;

    // Функция для создания новой еды в случайном месте
    function createFood() {
        food = {
            x: Math.floor(Math.random() * gridSize) * box,
            y: Math.floor(Math.random() * gridSize) * box
        };
        // Проверяем, не появилась ли еда внутри змейки
        if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
            createFood(); // Если да, создаем заново
        }
    }

    // Функция запуска новой игры
    function startGame() {
        // Сбрасываем состояние
        snake = [];
        score = 0;
        dx = 1;
        dy = 0;
        scoreText.innerText = `Счет: ${score}`;
        gameOverScreen.style.display = 'none';
        gameActive = true;

        // Создаем начальную змейку
        for (let i = 0; i < startLength; i++) {
            snake.push({ x: (gridSize / 2 - i) * box, y: (gridSize / 2) * box });
        }

        createFood();

        // Очищаем старый интервал, если он был
        if (gameInterval) clearInterval(gameInterval);
        
        // Основной цикл игры (100 миллисекунд = 10 кадров в секунду)
        gameInterval = setInterval(draw, 100);
    }

    // Функция отрисовки
    function draw() {
        // Смещаем змейку
        const newHead = { 
            x: snake[0].x + dx * box, 
            y: snake[0].y + dy * box 
        };

        // Проверка на столкновение со стеной
        if (newHead.x < 0 || newHead.x >= canvas.width || newHead.y < 0 || newHead.y >= canvas.height) {
            endGame();
            return;
        }

        // Проверка на столкновение с хвостом
        if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
            endGame();
            return;
        }

        // Добавляем новую голову в начало массива
        snake.unshift(newHead);

        // Проверяем, съела ли змейка еду
        if (newHead.x === food.x && newHead.y === food.y) {
            score++;
            scoreText.innerText = `Счет: ${score}`;
            createFood();
        } else {
            // Если еду не съели — убираем хвост
            snake.pop();
        }

        // Очищаем холст
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Рисуем еду
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x, food.y, box, box);

        // Рисуем змейку
        snake.forEach((segment, index) => {
            // Голова светится зеленым, тело — темно-зеленым
            ctx.fillStyle = index === 0 ? '#00ff00' : '#008000';
            ctx.fillRect(segment.x, segment.y, box, box);
            
            // Добавляем черную обводку для объема
            ctx.strokeStyle = '#000';
            ctx.strokeRect(segment.x, segment.y, box, box);
        });
    }

    // Функция конца игры
    function endGame() {
        gameActive = false;
        clearInterval(gameInterval);
        finalScoreText.innerText = score;
        gameOverScreen.style.display = 'flex';
    }

    // Управление с клавиатуры
    document.addEventListener('keydown', function(event) {
        if (!gameActive) return;

        // Запрещаем разворот на 180 градусов
        if (event.key === 'ArrowUp' && dy === 0) {
            dx = 0;
            dy = -1;
        } else if (event.key === 'ArrowDown' && dy === 0) {
            dx = 0;
            dy = 1;
        } else if (event.key === 'ArrowLeft' && dx === 0) {
            dx = -1;
            dy = 0;
        } else if (event.key === 'ArrowRight' && dx === 0) {
            dx = 1;
            dy = 0;
        }
    });

    // Перезапуск по кнопке
    restartBtn.addEventListener('click', startGame);

    // Запускаем игру при загрузке страницы
    startGame();
</script>

</body>
</html>
